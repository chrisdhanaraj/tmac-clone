name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: cd apps/front-office && pnpm db:generate

      - name: Check Prettier formatting
        run: |
          cd apps/front-office && pnpm format:check
          cd ../chat-listener && pnpm format:check

      - name: Run ESLint
        run: |
          cd apps/front-office && pnpm lint:check
          cd ../chat-listener && pnpm lint:check

      - name: Type check TypeScript
        run: |
          cd apps/front-office && pnpm typecheck
          cd ../chat-listener && pnpm typecheck

      - name: Build projects
        run: |
          cd apps/front-office && pnpm build
          cd ../chat-listener && pnpm build